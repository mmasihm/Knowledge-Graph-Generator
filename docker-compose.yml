services:
  falkordb:
    image: falkordb/falkordb:6.0.4
    ports:
      - "6379:6379"   # Redis protocol (graph queries)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false  # missing key is reported by the app itself
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      - ./data:/app/data:ro
      # Ledger + ontology live in a volume next to the graph's, so they are reset together.
      - app_state:/app/state
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
  app_state:
